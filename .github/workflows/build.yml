name: Build checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build release demo
        if: matrix.node == '24'
        run: npm run build:prod
        env:
          SITE_URL: https://teatime-starter.netlify.app
      - name: Bundle release downloads
        if: matrix.node == '24'
        run: python scripts/bundle-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == '24'
        with:
          name: teatime-release
          path: .cache/release/*
          if-no-files-found: error
